<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formularz wynajmu sprzętu górskiego">
    <title>Formularz wynajmu sprzętu</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Formularz wynajmu sprzętu</h1>
        </header>
        
        <main>
            <form id="equipmentForm">
                <!-- Personal Information Section -->
                <section class="personal-info">
                    <div class="form-group">
                        <label for="name">Imię *</label>
                        <input 
                            type="text" 
                            id="name" 
                            name="name"
                            required 
                            aria-required="true"
                            autocomplete="given-name">
                    </div>
                    <div class="form-group">
                        <label for="surname">Nazwisko *</label>
                        <input 
                            type="text" 
                            id="surname" 
                            name="surname"
                            required 
                            aria-required="true"
                            autocomplete="family-name">
                    </div>
                </section>
                
                <!-- Equipment Selection Section -->
                <section class="equipment-section">
                    <h2>Wybór sprzętu</h2>
                    <div class="equipment-table" role="table" aria-label="Tabela wyboru sprzętu">
                        <!-- Table header -->
                        <div class="equipment-row header" role="row">
                            <div class="col-equipment" role="columnheader">Sprzęt</div>
                            <div class="col-quantity" role="columnheader">Ilość</div>
                            <div class="col-notes" role="columnheader">Uwagi</div>
                        </div>
                        
                        <!-- Equipment item: Raki -->
                        <div class="equipment-row" data-equipment="Raki" role="row">
                            <div class="col-equipment" role="cell">Raki</div>
                            <div class="col-quantity" role="cell">
                                <label for="quantity-raki" class="sr-only">Ilość - Raki</label>
                                <input 
                                    type="number" 
                                    id="quantity-raki"
                                    name="quantity-raki" 
                                    min="0" 
                                    step="1"
                                    value="0"
                                    aria-label="Ilość - Raki">
                            </div>
                            <div class="col-notes" role="cell">
                                <label for="notes-raki" class="sr-only">Uwagi - Raki</label>
                                <input 
                                    type="text" 
                                    id="notes-raki"
                                    name="notes-raki"
                                    aria-label="Uwagi - Raki">
                            </div>
                        </div>
                        
                        <!-- Equipment item: Kask -->
                        <div class="equipment-row" data-equipment="Kask" role="row">
                            <div class="col-equipment" role="cell">Kask</div>
                            <div class="col-quantity" role="cell">
                                <label for="quantity-kask" class="sr-only">Ilość - Kask</label>
                                <input 
                                    type="number" 
                                    id="quantity-kask"
                                    name="quantity-kask" 
                                    min="0" 
                                    step="1"
                                    value="0"
                                    aria-label="Ilość - Kask">
                            </div>
                            <div class="col-notes" role="cell">
                                <label for="notes-kask" class="sr-only">Uwagi - Kask</label>
                                <input 
                                    type="text" 
                                    id="notes-kask"
                                    name="notes-kask"
                                    aria-label="Uwagi - Kask">
                            </div>
                        </div>
                        
                        <!-- Equipment item: Czekan -->
                        <div class="equipment-row" data-equipment="Czekan" role="row">
                            <div class="col-equipment" role="cell">Czekan</div>
                            <div class="col-quantity" role="cell">
                                <label for="quantity-czekan" class="sr-only">Ilość - Czekan</label>
                                <input 
                                    type="number" 
                                    id="quantity-czekan"
                                    name="quantity-czekan" 
                                    min="0" 
                                    step="1"
                                    value="0"
                                    aria-label="Ilość - Czekan">
                            </div>
                            <div class="col-notes" role="cell">
                                <label for="notes-czekan" class="sr-only">Uwagi - Czekan</label>
                                <input 
                                    type="text" 
                                    id="notes-czekan"
                                    name="notes-czekan"
                                    aria-label="Uwagi - Czekan">
                            </div>
                        </div>
                    </div>
                </section>
                
                <!-- Feedback Message Area -->
                <div id="feedbackMessage" class="feedback hidden" role="alert" aria-live="polite"></div>
                
                <!-- Submit Button -->
                <div class="form-actions">
                    <button type="submit" id="submitBtn">Wyślij</button>
                </div>
            </form>
        </main>
        
        <footer>
            <p>&copy; 2025 Formularz wynajmu sprzętu</p>
        </footer>
    </div>
    
    <script src="js/app.js"></script>
</body>
</html>
