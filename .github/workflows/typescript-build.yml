name: TypeScript Build Check

# Trigger on pull requests and pushes
on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build TypeScript
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build TypeScript
        run: npm run build
      
      - name: Check for uncommitted changes
        run: |
          if [[ -n $(git status --porcelain js/) ]]; then
            echo "Error: TypeScript compiled files are out of sync"
            echo "Please run 'npm run build' and commit the changes"
            git status --porcelain js/
            exit 1
          fi
